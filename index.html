// 渲染逻辑
// ============================================================
var searchInput = document.getElementById("searchInput");
var articleList = document.getElementById("articleList");
var emptyState = document.getElementById("emptyState");
var totalCountEl = document.getElementById("totalCount");
var showCountEl = document.getElementById("showCount");

// 高亮关键词
function highlightText(text, keyword) {
  if (!keyword) return text;
  var re = new RegExp("(" + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", "gi");
  return text.replace(re, '<em style="color:#c00;font-style:normal;">$1</em>');
}

// 从正文中截取关键词周围的片段
function getContentSnippet(content, keyword, maxLen) {
  maxLen = maxLen || 80;
  if (!content || !keyword) return "";
  var idx = content.toLowerCase().indexOf(keyword.toLowerCase());
  if (idx === -1) return content.substring(0, maxLen) + "...";
  var start = Math.max(0, idx - Math.floor((maxLen - keyword.length) / 2));
  var snippet = content.substring(start, start + maxLen);
  if (start > 0) snippet = "..." + snippet;
  if (start + maxLen < content.length) snippet = snippet + "...";
  return snippet;
}

// 渲染列表
function render(filterKeyword) {
  var kw = filterKeyword.trim().toLowerCase();
  var visibleCount = 0;

  articleList.innerHTML = "";

  articles.forEach(function(article) {
    // 搜索匹配：标题 + 关键词 + 正文全文
    var matched = !kw;
    var matchTerms = [];
    var matchSource = ""; // "title" | "keyword" | "content"

    if (kw) {
      if (article.title.toLowerCase().indexOf(kw) !== -1) {
        matched = true;
        matchSource = "title";
      }
      article.keywords.forEach(function(k) {
        if (k.toLowerCase().indexOf(kw) !== -1) {
          matched = true;
          matchTerms.push(k);
          if (!matchSource) matchSource = "keyword";
        }
      });
      // 全文搜索
      var body = article.content || "";
      if (!matched && body.toLowerCase().indexOf(kw) !== -1) {
        matched = true;
        matchSource = "content";
      }
    }

    if (!matched) return;
    visibleCount++;

    var li = document.createElement("li");
    li.className = "article-item";

    // 标题（可点击跳转）
    var titleHTML = highlightText(article.title, kw ? filterKeyword.trim() : "");
    var titleEl = '<span class="title">' + titleHTML + '</span>';

    // 来源标签
    var sourceTag = '<span class="source-tag">' + article.source + '</span>';

    // 正文匹配片段（仅当关键词在正文中命中时显示）
    var snippetHTML = "";
    if (kw && matchSource === "content" && article.content) {
      var snippet = getContentSnippet(article.content, filterKeyword.trim());
      snippet = highlightText(snippet, filterKeyword.trim());
      snippetHTML = '<div class="content-snippet">' + snippet + '</div>';
    }

    // 关键词标签
    var tagsHTML = "";
    if (article.keywords.length > 0) {
      tagsHTML = '<div class="keywords">';
      article.keywords.forEach(function(k) {
        var cls = (kw && k.toLowerCase().indexOf(kw) !== -1) ? 'tag highlight' : 'tag';
        tagsHTML += '<span class="' + cls + '">' + k + '</span>';
      });
      tagsHTML += '</div>';
    }

    li.innerHTML = sourceTag + titleEl + tagsHTML + snippetHTML;

    // 点击跳转
    li.addEventListener("click", function() {
      if (article.link) {
        window.location.href = article.link;
      }
    });

    li.style.cursor = article.link ? "pointer" : "default";
    articleList.appendChild(li);
  });

  // 更新计数
  totalCountEl.textContent = articles.length;
  showCountEl.textContent = visibleCount;

  // 空状态
  if (visibleCount === 0) {
    emptyState.classList.remove("hidden");
  } else {
    emptyState.classList.add("hidden");
  }
}

// 搜索事件
searchInput.addEventListener("input", function() {
  render(this.value);
});

// 初始渲染
render("");
