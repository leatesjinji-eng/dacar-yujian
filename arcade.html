<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>迷你游戏厅 · Mini Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1117;
    --bg-soft: #161a24;
    --card: #1c2130;
    --card-hover: #232a3c;
    --ink: #f4f6fb;
    --muted: #9aa3b5;
    --border: #2a3142;
    --accent: #6366f1;
    --accent-2: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% -10%, #1a2136 0%, var(--bg) 55%) fixed;
    color: var(--ink);
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    background: rgba(15,17,23,.72);
    border-bottom: 1px solid var(--border);
  }
  .bar {
    max-width: 1180px; margin: 0 auto; padding: 14px 22px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 900; letter-spacing: -.02em;
    color: var(--ink); text-decoration: none; white-space: nowrap;
  }
  .logo-mark {
    width: 38px; height: 38px; border-radius: 11px; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 18px rgba(99,102,241,.35);
  }
  .logo small { font-weight: 700; color: var(--muted); font-size: 13px; display: block; line-height: 1.1; }
  .search {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 14px; min-width: 200px;
  }
  .search svg { opacity: .55; flex: 0 0 auto; }
  .search input {
    background: none; border: none; outline: none; color: var(--ink);
    font-family: inherit; font-size: 14px; width: 100%;
  }
  .search input::placeholder { color: var(--muted); }

  /* ---------- Hero ---------- */
  .hero { max-width: 1180px; margin: 0 auto; padding: 44px 22px 10px; }
  .hero h1 {
    font-size: clamp(26px, 4.5vw, 42px); font-weight: 900; letter-spacing: -.03em;
  }
  .hero h1 .grad {
    background: linear-gradient(90deg, #818cf8, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); font-weight: 700; margin-top: 8px; font-size: 16px; }

  /* ---------- Game grid ---------- */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 22px 70px; }
  .section-title {
    font-size: 18px; font-weight: 800; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 8px; margin: 6px 0 16px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; overflow: hidden; cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover {
    transform: translateY(-6px); background: var(--card-hover);
    border-color: #3a4460;
    box-shadow: 0 22px 46px rgba(0,0,0,.5), 0 0 0 1px rgba(103,232,249,.12);
  }
  .thumb {
    aspect-ratio: 16 / 10; position: relative;
    display: grid; place-items: center; overflow: hidden;
  }
  .thumb .emoji {
    font-size: 64px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.4));
    transform: translateY(0); transition: transform .25s ease;
  }
  .card:hover .thumb .emoji { transform: translateY(-4px) scale(1.08); }
  .thumb .badge {
    position: absolute; top: 12px; left: 12px;
    font-size: 11px; font-weight: 800; letter-spacing: .02em;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(0,0,0,.35); color: #fff; backdrop-filter: blur(4px);
  }
  .body { padding: 15px 16px 16px; }
  .body h3 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .body .desc { color: var(--muted); font-size: 13.5px; font-weight: 600; margin: 6px 0 12px; min-height: 40px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 8px;
    background: rgba(129,140,248,.14); color: #b9c1f7; letter-spacing: .02em;
  }
  .play {
    margin-top: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; padding: 10px; border: none; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-family: inherit; font-size: 14px; font-weight: 800;
    cursor: pointer; transition: filter .15s ease, transform .15s ease;
    box-shadow: 0 8px 20px rgba(99,102,241,.3);
  }
  .play:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .play:active { transform: scale(.98); }

  footer {
    max-width: 1180px; margin: 0 auto; padding: 0 22px 40px;
    color: var(--muted); font-size: 12.5px; font-weight: 600;
  }

  /* ---------- Game overlay (iframe) ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 100;
    background: #0a0c12; display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }
  .gamebar {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: rgba(15,17,23,.9); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .gbtn {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card);
    color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
    transition: background .12s ease, transform .12s ease;
  }
  .gbtn:hover { background: var(--card-hover); }
  .gbtn:active { transform: scale(.96); }
  .gbtn.back { background: rgba(129,140,248,.18); border-color: rgba(129,140,248,.4); }
  .game-title { font-size: 15px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game-title small { color: var(--muted); font-weight: 700; margin-left: 6px; }
  .spacer { flex: 1; }
  #frame-wrap { flex: 1; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #0a0c12; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="#" onclick="closeGame(); return false;">
      <span class="logo-mark">🎮</span>
      <span>迷你游戏厅<small>Mini Arcade</small></span>
    </a>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" type="text" placeholder="搜索游戏…" />
    </div>
  </div>
</header>

<div class="hero">
  <h1>选择一款游戏，<span class="grad">开始玩吧</span></h1>
  <p>全部免费，即点即玩 · 支持全屏</p>
</div>

<main class="wrap">
  <div class="section-title">热门游戏</div>
  <div class="grid" id="grid"></div>
</main>

<footer>🎮 迷你游戏厅 — 点开游戏卡片即可游玩。</footer>

<div id="overlay">
  <div class="gamebar">
    <button class="gbtn back" onclick="closeGame()">← 返回</button>
    <span class="game-title" id="gameTitle"></span>
    <span class="spacer"></span>
    <button class="gbtn" id="fsBtn" onclick="toggleFullscreen()">⛶ 全屏</button>
  </div>
  <div id="frame-wrap"><iframe id="gameFrame" allow="fullscreen; autoplay" allowfullscreen></iframe></div>
</div>

<script>
  var GAMES = [
    {
      id: "sky",
      title: "天空塔台",
      sub: "Sky Control",
      emoji: "✈️",
      url: "sky-control.html",
      tags: ["塔台指挥", "策略", "航空"],
      desc: "化身塔台管制员，指挥航班安全起降。",
      grad: "linear-gradient(135deg, #6366f1, #22d3ee)"
    },
    {
      id: "find",
      title: "BallDefender",
      sub: "弹球防御",
      emoji: "🛡️",
      url: "findnder.html",
      tags: ["弹球", "瞄准射击", "街机"],
      desc: "瞄准发射小球，击碎不断下压的数字方块。",
      grad: "linear-gradient(135deg, #0ea5e9, #67e8f9)"
    },
    {
      id: "garbage",
      title: "垃圾分类",
      sub: "Garbage Sort",
      emoji: "♻️",
      url: "garbage-sort.html",
      tags: ["垃圾分类", "环保", "益智"],
      desc: "帮垃圾站分类，把每件垃圾投进正确的垃圾桶。",
      grad: "linear-gradient(135deg, #16a34a, #4ade80)"
    }
  ];

  var grid = document.getElementById("grid");

  function render(filter) {
    var q = (filter || "").trim().toLowerCase();
    var list = GAMES.filter(function (g) {
      return !q || (g.title + g.sub + g.desc + g.tags.join("")).toLowerCase().indexOf(q) !== -1;
    });
    grid.innerHTML = "";
    list.forEach(function (g) {
      var card = document.createElement("article");
      card.className = "card";
      card.innerHTML =
        '<div class="thumb" style="background:' + g.grad + '">' +
          '<span class="badge">免费</span>' +
          '<span class="emoji">' + g.emoji + '</span>' +
        '</div>' +
        '<div class="body">' +
          '<h3>' + g.title + ' <small style="color:var(--muted);font-weight:700">' + g.sub + '</small></h3>' +
          '<div class="desc">' + g.desc + '</div>' +
          '<div class="tags">' + g.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join("") + '</div>' +
          '<button class="play">▶ 立即玩</button>' +
        '</div>';
      card.addEventListener("click", function () { openGame(g); });
      grid.appendChild(card);
    });
  }

  var overlay = document.getElementById("overlay");
  var frame = document.getElementById("gameFrame");
  var gameTitle = document.getElementById("gameTitle");

  function openGame(g) {
    gameTitle.innerHTML = g.title + '<small>' + g.sub + '</small>';
    frame.src = g.url;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeGame() {
    overlay.classList.remove("open");
    frame.src = "about:blank";
    document.body.style.overflow = "";
  }
  function toggleFullscreen() {
    var el = document.documentElement;
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    if (fs) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  }

  document.getElementById("searchInput").addEventListener("input", function (e) { render(e.target.value); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeGame();
  });

  render("");
</script>
</body>
</html>
